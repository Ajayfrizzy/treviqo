name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: treviqo_test
          POSTGRES_DB: treviqo_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U treviqo_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://treviqo_test@localhost:5432/treviqo_test
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:deploy
      - run: npm run test:integration
      - run: npm run build
      - run: npm run worker:build
      - run: npx playwright install --with-deps chromium
      - name: Verify production tab navigation
        env:
          NAVIGATION_TLS_KEY: ${{ runner.temp }}/treviqo-navigation.key
          NAVIGATION_TLS_CERT: ${{ runner.temp }}/treviqo-navigation.crt
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$NAVIGATION_TLS_KEY" -out "$NAVIGATION_TLS_CERT" \
            -days 1 -subj /CN=127.0.0.1 -addext 'subjectAltName=IP:127.0.0.1'
          npx playwright test --config playwright.navigation.config.ts
      - name: Upload production navigation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-production
          path: test-results/navigation-production/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run test:e2e
